; ============================================================
;  E7 — boat receiver. No Bluetooth needed here, so this is a plain
;  Arduino project (unlike boat-firmware/, which needs the Bluepad32
;  ESP-IDF template). Flash this to the BOAT, replacing its earlier firmware.
; ============================================================
[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
