; ============================================================
;  E7 helper — print the boat's MAC address (needed by handheld/).
;  Flash once to the BOAT board, read the address off the serial monitor,
;  then re-flash the boat with boat-receiver/ afterwards.
; ============================================================
[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
